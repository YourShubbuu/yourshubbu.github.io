{% extends "layout.html" %}

{% block main %}

    <h2>Sell Stock</h2>

    <form action="/sell" method="post">

        <div class="mb-3">
            <select class="form-select mx-auto w-auto" name="symbol">
                <option disabled selected value="">Select a stock</option>

                {% for stock in stocks %}
                    <option value="{{ stock['symbol'] }}">
                        {{ stock['symbol'] }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <input
                autocomplete="off"
                class="form-control mx-auto w-auto"
                name="shares"
                placeholder="Number of shares"
                type="text">
        </div>

        <button class="btn btn-danger" type="submit">
            Sell
        </button>

    </form>

{% endblock %}
