{% extends "layout.html" %}

{% block main %}

    <h2>Get a Stock Quote</h2>

    <form action="/quote" method="post">

        <div class="mb-3">
            <input
                autocomplete="off"
                autofocus
                class="form-control mx-auto w-auto"
                name="symbol"
                placeholder="Stock Symbol (e.g. AAPL)"
                type="text">
        </div>

        <button class="btn btn-primary" type="submit">
            Get Quote
        </button>

    </form>

    {% if quote %}
        <div class="mt-4">
            <h4>{{ quote["name"] }}</h4>
            <p>{{ quote["symbol"] }}: ${{ quote["price"] }}</p>
        </div>
    {% endif %}

{% endblock %}
